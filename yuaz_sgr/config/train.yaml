optimizer:
  name: Adam
  lr: 1.0e-5
  betas: [0.8, 0.999]

batch_size: 8
total_steps: 200000
precision: fp16

# 论文 §4.2:
#   AE:    0 ~ 20k   (自编码器预训练)
#   GAN:   20k ~ 50k  (引入 MPD+MSD 判别器)
#   Joint: 50k ~ 100k (全联合优化: flow thru decoder + f0_refined + temporal + 判别器)
stages:
  ae:
    start: 0
    end: 20000
  gan:
    start: 20000
    end: 50000
  joint:
    start: 50000
    end: 200000

# 论文 §4.2: λ_lag=0.02 λ_dur=0.02 λ_STFT=1.0 λ_RVQ=0.5 λ_GAN=0.5 λ_FM=1.0 λ_feature=0.1
loss_weights:
  stft: 1.0
  rvq: 0.5
  gan: 0.5
  fm: 1.0
  feature: 0.1
  lag: 0.02
  dur: 0.05    # 平衡: 加速收敛但不破坏稳定性 (0.02太慢, 0.1太大)

log_interval: 100
save_interval: 1000
eval_interval: 5000
