# 李老师数据集微调配置
# 继承 base/model/train，覆盖必要参数

sample_rate: 24000
hop_length: 256
n_fft: 1024
n_mfcc: 30

# 关键: 匹配数据集实际片段时长（~6.4秒，取整到7秒）
segment_seconds: 7

normalize_db: -26

# 音素数将由预处理后的 phoneme_map.json 动态覆盖
num_phonemes: 30

test_songs: 1
val_songs: 1

# 微调: 减少总步数，从200K 基座继续
batch_size: 4           # RTX 4080 32GB 可用 BS=4
total_steps: 30000       # 微调 30K 步

precision: fp16

stages:
  ae:
    end: 0               # 基座已完成 AE 预训练，微调直接从 joint 开始
  gan:
    end: 0               # 基座已完成 GAN 训练
  joint:
    end: 30000           # 全联合微调

loss_weights:
  stft: 1.0
  rvq: 0.5
  gan: 0.5
  fm: 1.0
  feature: 0.1
  lag: 0.02
  dur: 0.05

log_interval: 50         # 更频繁的日志（数据量小）
save_interval: 1000
eval_interval: 2000
